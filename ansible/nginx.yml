---
- hosts: webservers
  become: yes

  tasks:

  - name: Install nginx
    yum:
      name: nginx
      state: present

  - name: Start nginx
    service:
      name: nginx
      state: started
      enabled: yes

  - name: Deploy webpage
    template:
      src: templates/index.html.j2
      dest: /usr/share/nginx/html/index.html

  - name: Restart nginx
    service:
      name: nginx
      state: restarted
